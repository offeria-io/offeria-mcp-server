apiVersion: apps/v1
kind: Deployment
metadata:
  name: offeria-mcp-server
  labels:
    app: offeria-mcp-server
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: offeria-mcp-server

  template:
    metadata:
      labels:
        app: offeria-mcp-server

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: offeria-mcp-server
          image: offeria-mcp-server:54
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: offeria-mcp-server-config

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
